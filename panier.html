    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

    <header class="navbar-wrap">
        <nav class="navbar">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-crown"></i>

            </a>
            <ul class="menu">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="boutique.html">Boutique</a></li>
                <li><a href="panier.html" class="active">Panier</a></li>

                    <span id="nombrePanier" class="cart-count">0</span>
                </a>

            <div>

            </div>
            <div>

                <p>📞 <span data-contact="phone1">+242 06 176 32 04</span></p>
                <p>✉ <span data-contact="email">khanihenoc8@gmail.com</span></p>
            </div>
        </div>
        <p class="footer-copy">© 2026 KHANI Fashion.</p>
