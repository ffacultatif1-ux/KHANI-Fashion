<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories | KHANI Fashion Admin</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body" data-page="categories">

    <aside class="sidebar">
        <div class="admin-logo">
            <i class="fa-solid fa-crown"></i>
            <h2>KHANI</h2>
            <p>ADMIN</p>
        </div>
        <ul>
            <li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
            <li><a href="produits.html"><i class="fa-solid fa-shirt"></i> Produits</a></li>
            <li class="active"><a href="categories.html"><i class="fa-solid fa-folder"></i> Catégories</a></li>
            <li><a href="commandes.html"><i class="fa-solid fa-cart-shopping"></i> Commandes</a></li>
            <li><a href="statistiques.html"><i class="fa-solid fa-chart-pie"></i> Statistiques</a></li>
            <li><a href="parametres.html"><i class="fa-solid fa-gear"></i> Paramètres</a></li>
        </ul>
        <button id="logoutBtn" class="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Déconnexion</span>
        </button>
    </aside>

    <main class="dashboard">
        <header class="dashboard-header">
            <div>
                <h1>Gestion des catégories 📁</h1>
                <p>Organisez vos collections</p>
            </div>
        </header>

        <section class="dashboard-box">
            <h2><i class="fa-solid fa-plus-circle"></i> Ajouter une catégorie</h2>
            <form id="categorieForm" class="admin-form" enctype="multipart/form-data">
                <input type="text" id="nomCategorie" name="nom" placeholder="Nom de la catégorie" required>
                <input type="text" id="descCategorie" name="description" placeholder="Description (optionnel)">

                <div class="upload-zone">
                    <label for="imageCategorie" class="upload-label">
                        <i class="fa-solid fa-image"></i>
                        <span>Image de la catégorie (optionnel)</span>
                        <input type="file" id="imageCategorie" name="image" accept="image/*" onchange="previewImage(this, 'catImagePreview')">
                    </label>
                    <img id="catImagePreview" alt="Aperçu" style="display:none">
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-plus"></i> Ajouter catégorie
                </button>
            </form>
        </section>

        <section class="dashboard-box">
            <h2><i class="fa-solid fa-list"></i> Mes catégories</h2>
            <div id="listeCategories"></div>
        </section>
    </main>

    <script src="../js/admin.js"></script>
</body>
</html>
