<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | KHANI Fashion Admin</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <div class="login-deco">
        <div class="deco-circle deco-1"></div>
        <div class="deco-circle deco-2"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <i class="fa-solid fa-crown"></i>
                <h1>KHANI Fashion</h1>
                <p>Administration</p>
            </div>

            <form id="loginForm">
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" placeholder="Nom d'utilisateur" autocomplete="username" required>
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password" required>
                </div>
                <button type="submit">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Connexion</span>
                </button>
            </form>

            <a href="../index.html" class="retour">
                <i class="fa-solid fa-arrow-left"></i> Retour au site
            </a>
        </div>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
