<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commande | KHANI Fashion</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar-wrap">
        <nav class="navbar">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-crown"></i>
                <span>KHANI Fashion</span>
            </a>
            <ul class="menu">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="boutique.html">Boutique</a></li>
                <li><a href="panier.html">Panier</a></li>
            </ul>
            <div class="icons">
                <a href="panier.html" class="icon-btn panier-link">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="nombrePanier" class="cart-count">0</span>
                </a>
            </div>
        </nav>
    </header>

    <section class="commande-section">
        <div class="commande-card">
            <div class="commande-icon">
                <i class="fa-brands fa-whatsapp"></i>
            </div>
            <h1>Finaliser ma commande</h1>
            <p class="commande-subtitle">
                Renseignez vos informations, nous vous contactons immédiatement sur WhatsApp
            </p>

            <form id="formCommande" class="form-stack">
                <div class="input-icon">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="nomClient" placeholder="Votre nom complet" required>
                </div>
                <div class="input-icon">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="telephoneClient" placeholder="Votre téléphone" required>
                </div>
                <div class="input-icon">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="emailClient" placeholder="Votre email (optionnel)">
                </div>
                <div class="input-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" id="adresseClient" placeholder="Adresse de livraison" required>
                </div>
                <div class="input-icon">
                    <i class="fa-solid fa-credit-card"></i>
                    <select id="paiementClient">
                        <option value="livraison">💵 Paiement à la livraison</option>
                        <option value="mobile_money">📱 Mobile Money (Airtel / MTN)</option>
                    </select>
                </div>

                <div class="commande-recap">
                    <strong>Total : <span id="totalPrix">0</span> FCFA</strong>
                </div>

                <button type="submit" class="btn btn-whatsapp btn-large">
                    <i class="fa-brands fa-whatsapp"></i> Confirmer et envoyer sur WhatsApp
                </button>
            </form>

            <a href="panier.html" class="back-link">← Retour au panier</a>
        </div>
    </section>

    <footer>
        <p>KHANI Fashion · <span data-contact="phone1">+242 06 176 32 04</span></p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
